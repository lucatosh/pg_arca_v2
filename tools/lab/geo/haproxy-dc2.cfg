global
  maxconn 200
defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
listen primary          # :5000 -> the site's leader (on DC2: the standby leader, read-only until the site is promoted)
  bind *:5000
  option httpchk GET /leader
  http-check expect status 200
  server dc2-pg1 dc2-pg1:5432 check port 8008
  server dc2-pg2 dc2-pg2:5432 check port 8008
listen replicas
  bind *:5001
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server dc2-pg1 dc2-pg1:5432 check port 8008
  server dc2-pg2 dc2-pg2:5432 check port 8008
