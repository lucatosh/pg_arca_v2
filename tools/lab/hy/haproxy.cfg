global
  maxconn 200
defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
resolvers docker
  nameserver dns 127.0.0.11:53
listen leader          # :5000 -> the site's leader (primary, or standby leader while the site is a standby site): what the other site replicates from
  bind *:5000
  option httpchk GET /leader
  http-check expect status 200
  server hy1 hy1:5432 check port 8008 resolvers docker init-addr none
  server hy2 hy2:5432 check port 8008 resolvers docker init-addr none
